server:
  port: 8085
  compression:
    enabled: true
    mime-types:
      - application/json
      - text/plain
      - application/xml
    min-response-size: 1024

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: authorization-service
              uri: lb://authorization
              predicates:
                - Path=/api/v1/auth/**

vaultix:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
