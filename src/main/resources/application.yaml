server:
  port: ${SERVER_PORT:8085}
  compression:
    enabled: true
    mime-types:
      - application/json
      - text/plain
      - application/xml
    min-response-size: 1024

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: authorization-service
              uri: lb://authorization
              predicates:
                - Path=/api/v1/auth/**

vaultix:
  cors:
    allowed-origins: ${VAULTIX_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://zj153pc4-3000.inc1.devtunnels.ms}
    allowed-methods: ${VAULTIX_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${VAULTIX_CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${VAULTIX_CORS_ALLOW_CREDENTIALS:true}
    max-age: ${VAULTIX_CORS_MAX_AGE:3600}
  geoip:
    database-path: ${VAULTIX_GEOIP_DATABASE_PATH:../infra/geoip/GeoLite2-City.mmdb}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
